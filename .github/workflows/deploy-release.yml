name: Continuous Deployment Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:
    - name: Set environment variable
      run: |
        echo "VITE_TRACKER_SCRIPT=${{ secrets.VITE_TRACKER_SCRIPT }}" >> $GITHUB_ENV
        echo "TILEJSON_URL=${{ secrets.TILEJSON_URL }}" >> $GITHUB_ENV
        echo "VITE_HIDDEN_CATEGORIES=${{ secrets.VITE_HIDDEN_CATEGORIES }}" >> $GITHUB_ENV

    - name: Checkout
      uses: actions/checkout@v3

    - name: Build
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
    - run: |
        npm ci
        npm run build

    - name: Deploy
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET }}
        ENDPOINT: https://fra1.digitaloceanspaces.com
        TARGET: s3://w3geo/${{ secrets.S3_BUCKET }}
      run: |
        # Everything except map/ is purged of stale files (hashed assets pile up otherwise)
        aws s3 sync dist "$TARGET" \
          --delete --exclude 'map/*' --exclude '*.DS_Store' \
          --acl public-read --endpoint-url "$ENDPOINT"
        # map/ mixes build output with content from outside the build, and has no
        # hashed filenames, so nothing needs pruning here - upload without --delete
        aws s3 sync dist/map "$TARGET/map" \
          --exclude '*.DS_Store' \
          --acl public-read --endpoint-url "$ENDPOINT"

